[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aaa-bench"
version = "1.0.0"
description = "AAA-Bench: counterfactual, verifier-grounded evaluation of vision-language models as decision-makers under visual ambiguity (WACV 2027)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (code); CC-BY-4.0 (annotations)"}
authors = [{name = "Shahriar Shakir Sumit"}, {name = "Murat Tahtali"}, {name = "Seyedali Mirjalili"}]
dependencies = []

[project.optional-dependencies]
analysis = ["numpy", "matplotlib", "scikit-learn"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["aaa_bench*"]
